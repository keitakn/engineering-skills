<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg:#fff; --fg:#14161a; --muted:#5c6470; --line:#e3e6ea; --card:#fbfcfd; --accent:#2f6feb;
  --warn-bg:#fff6e5; --warn-line:#e8a33d; --danger-bg:#fdeeee; --danger-line:#d9534f;
  --ok-bg:#eef8f1; --ok-line:#3fa564; --code-bg:#f3f5f7; --tag-bg:#eceff3;
  --ins:#3fa564; --upd:#2f6feb; --del:#d9534f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#14161a; --fg:#e7eaee; --muted:#9aa4b2; --line:#2a2f37; --card:#1a1d23; --accent:#6ea3ff;
    --warn-bg:#2e2618; --warn-line:#c9902f; --danger-bg:#2e1c1c; --danger-line:#cf6b67;
    --ok-bg:#17281d; --ok-line:#4fa76d; --code-bg:#21252c; --tag-bg:#262b33;
    --ins:#4fa76d; --upd:#6ea3ff; --del:#cf6b67;
  }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); line-height:1.75; font-size:15px;
  font-family:"Hiragino Sans","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif; }
.wrap { max-width:1120px; margin:0 auto; padding:32px 24px 80px; }

/* ヘッダー */
header.top { border-bottom:2px solid var(--fg); padding-bottom:20px; }
.eyebrow { font-size:11px; letter-spacing:.18em; color:var(--muted); font-weight:700; }
h1 { font-size:25px; margin:8px 0 14px; line-height:1.4; }
.stats { display:flex; flex-wrap:wrap; gap:8px; }
.stat { background:var(--tag-bg); border-radius:6px; padding:4px 11px; font-size:12px; color:var(--muted); }
.stat b { color:var(--fg); font-weight:700; }
.crumb { font-size:12px; color:var(--muted); }
.src { font-size:12px; color:var(--muted); font-family:ui-monospace,Menlo,monospace; }

/* 節 */
.section { margin-top:52px; }
.section-head { display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--line);
  padding-bottom:8px; margin-bottom:20px; }
.section-num { font-size:11px; letter-spacing:.14em; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; }
h2 { font-size:19px; margin:0; }
.lead { color:var(--muted); font-size:13.5px; margin:-10px 0 20px; }

/* 冒頭の要約と注意書き */
.tldr { background:var(--ok-bg); border-left:4px solid var(--ok-line); border-radius:0 8px 8px 0;
  padding:16px 20px; margin-top:24px; }
.tldr p { margin:0 0 10px; } .tldr p:last-child { margin-bottom:0; }
.headline { background:var(--warn-bg); border-left:4px solid var(--warn-line); border-radius:0 8px 8px 0;
  padding:16px 20px; margin-top:14px; }
.headline .h { font-weight:700; margin-bottom:6px; }

/* 処理の流れ（CSSだけで描く。Mermaidを使うほどでない直線的な流れ向け） */
.flow { display:flex; flex-direction:column; }
.step { display:grid; grid-template-columns:46px 1fr 152px; gap:14px; align-items:start;
  border:1px solid var(--line); border-radius:8px; padding:12px 14px; background:var(--card); }
.arrow { height:16px; display:flex; justify-content:center; align-items:center; color:var(--muted); font-size:13px; }
.step-n { font-weight:800; font-size:13px; color:var(--bg); background:var(--fg); border-radius:6px;
  text-align:center; padding:3px 0; font-variant-numeric:tabular-nums; }
.step-title { font-weight:700; font-size:14.5px; }
.step-desc { color:var(--muted); font-size:12.5px; margin-top:3px; }
.step.gate { border-left:4px solid var(--warn-line); }
.tx { font-size:10.5px; text-align:center; border-radius:5px; padding:3px 6px; font-weight:700; line-height:1.5; }
.tx-read { background:var(--tag-bg); color:var(--muted); }
.tx-write { background:var(--ok-bg); color:var(--ok-line); }
.tx-none { background:var(--warn-bg); color:var(--warn-line); }

/* 層と依存の向き */
.layers { display:grid; gap:10px; }
.layer { border:1px solid var(--line); border-radius:8px; padding:12px 16px; background:var(--card); }
.layer-name { font-weight:700; font-size:13.5px; }
.layer-role { color:var(--muted); font-size:12.5px; margin-top:2px; }
.dep-note { display:flex; gap:10px; align-items:center; color:var(--muted); font-size:12.5px;
  justify-content:center; padding:2px 0; }

/* 「なぜそうなっているか」のカード */
.cards { display:grid; gap:14px; }
.card { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:0 8px 8px 0;
  background:var(--card); padding:14px 18px; }
.card.risk { border-left-color:var(--danger-line); background:var(--danger-bg); }
.card.trap { border-left-color:var(--warn-line); background:var(--warn-bg); }
.card-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.card-title { font-weight:700; font-size:14.5px; }
.ref { font-size:11px; color:var(--muted); margin-left:auto; font-family:ui-monospace,Menlo,monospace; }
.card-body { margin-top:9px; font-size:13.5px; }
.why { margin-top:9px; padding-top:9px; border-top:1px dashed var(--line); font-size:13px; }
.why b { color:var(--accent); }
.card.risk .why b { color:var(--danger-line); }
.card.trap .why b { color:var(--warn-line); }

/* 識別子バッジ。チャットでの深掘り依頼に使う */
.id { font-family:ui-monospace,Menlo,monospace; font-size:11px; font-weight:700;
  background:var(--fg); color:var(--bg); border-radius:4px; padding:2px 7px; }

/* 表 */
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { text-align:left; padding:9px 11px; border-bottom:1px solid var(--line); vertical-align:top; }
th { font-size:11.5px; color:var(--muted); letter-spacing:.06em; font-weight:700; }
td.ch { font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:700; }
.pri { display:inline-block; font-size:10.5px; font-weight:700; border-radius:4px; padding:2px 7px; white-space:nowrap; }
.p-must { background:var(--danger-bg); color:var(--danger-line); }
.p-work { background:var(--warn-bg); color:var(--warn-line); }
.p-skim { background:var(--tag-bg); color:var(--muted); }

/* 書き込み先の対応表（API × テーブルなど） */
.matrix { width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px; }
.matrix th, .matrix td { border-bottom:1px solid var(--line); padding:9px 8px; text-align:center; }
.matrix th.api { text-align:left; width:250px; }
.matrix td.tbl { text-align:left; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; }
.matrix thead th { font-size:11px; color:var(--muted); font-weight:700; vertical-align:bottom; line-height:1.35; }
.op { display:inline-block; font-size:10px; font-weight:800; border-radius:4px; padding:2px 6px; color:#fff; }
.op-i { background:var(--ins); } .op-u { background:var(--upd); } .op-d { background:var(--del); }
.dash { color:var(--line); }
.untouched td { opacity:.55; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:12px; }

/* Mermaid の図 */
.mermaid-box { border:1px solid var(--line); border-radius:10px; background:var(--card); padding:14px; overflow-x:auto; }
.mermaid { text-align:center; }
.mermaid svg { max-width:none; height:auto; }
.figcap { color:var(--muted); font-size:12.5px; margin-top:8px; }

/* コード表示 */
pre.code { background:var(--code-bg); border:1px solid var(--line); border-radius:8px; padding:14px 16px;
  overflow-x:auto; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; line-height:1.65; margin:0; }
pre.code .ln { color:var(--muted); user-select:none; }
pre.code .hi { background:var(--warn-bg); display:inline-block; width:100%; }
pre.code .cmt { color:var(--muted); }
pre.code .kw { color:var(--accent); }
code { background:var(--code-bg); border-radius:4px; padding:1px 5px;
  font-family:ui-monospace,Menlo,monospace; font-size:.88em; }

/* 強調ブロック */
.box { border-left:4px solid var(--danger-line); background:var(--danger-bg); border-radius:0 8px 8px 0; padding:14px 18px; }
.box.ok { border-left-color:var(--ok-line); background:var(--ok-bg); }
.box.warn { border-left-color:var(--warn-line); background:var(--warn-bg); }
.box .h { font-weight:700; margin-bottom:6px; }

/* 末尾の案内 */
.ask { margin-top:56px; border:1px dashed var(--line); border-radius:8px; padding:16px 20px;
  background:var(--card); font-size:13px; color:var(--muted); }
.ask b { color:var(--fg); }

@media (max-width:720px) {
  .step { grid-template-columns:38px 1fr; }
  .tx { grid-column:2; justify-self:start; }
  .ref { margin-left:0; width:100%; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ここに本文を書く。使えるパーツは上のCSSのコメントを参照 -->
  {{BODY}}

</div>

<!-- 検証スクリプトがページ全体の高さを知るための出力。表示には影響しないので削除しない -->
<script>
  const reportHeight = () => {
    document.body.dataset.pageHeight = String(document.documentElement.scrollHeight);
  };
  document.addEventListener('DOMContentLoaded', reportHeight);
  window.reportPageHeight = reportHeight;
</script>

<!--
  Mermaid を使う図が1つも無い場合は、以下の script 要素ごと削除する。
  図ごとに一意の id を明示的に渡すこと（理由は SKILL.md「Mermaid の使い方」を参照）。
-->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });
  const nodes = [...document.querySelectorAll('.mermaid')];
  for (let i = 0; i < nodes.length; i++) {
    const { svg } = await mermaid.render('fig-' + i, nodes[i].textContent);
    nodes[i].innerHTML = svg;
  }
  document.body.dataset.mermaidReady = '1';
  window.reportPageHeight();
</script>
</body>
</html>
